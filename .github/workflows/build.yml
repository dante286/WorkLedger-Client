name: Build and Package WorkLedger

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Publish Windows
      if: matrix.os == 'windows-latest'
      run: |
        # Publish for Windows
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o ./publish/win-x64
        # Create installer using NSIS
        # NSIS is already pre-installed on windows-latest runner
        # Create NSIS installer script
        echo '!include "MUI2.nsh"' > installer.nsi
        echo 'Name "WorkLedger"' >> installer.nsi
        echo 'OutFile "WorkLedger-setup.exe"' >> installer.nsi
        echo 'InstallDir "$PROGRAMFILES\WorkLedger"' >> installer.nsi
        echo 'RequestExecutionLevel admin' >> installer.nsi
        echo '!insertmacro MUI_PAGE_DIRECTORY' >> installer.nsi
        echo '!insertmacro MUI_PAGE_INSTFILES' >> installer.nsi
        echo '!insertmacro MUI_LANGUAGE "English"' >> installer.nsi
        echo 'Section "MainSection"' >> installer.nsi
        echo '  SetOutPath "$INSTDIR"' >> installer.nsi
        echo '  File /r "publish\win-x64\*"' >> installer.nsi
        echo '  CreateShortcut "$SMPROGRAMS\WorkLedger.lnk" "$INSTDIR\WorkLedger-Client.exe"' >> installer.nsi
        echo 'SectionEnd' >> installer.nsi
        # makensis is pre-installed but not in PATH on some runners
        & "C:\Program Files (x86)\NSIS\makensis.exe" ./installer.nsi
        # Cleanup publish folder to save space
        rm -rf ./publish/win-x64

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: workledger-windows
        path: |
          ./WorkLedger-setup.exe

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Get tag name
      id: tag
      run: |
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "tag_provided=true" >> $GITHUB_OUTPUT
        else
          echo "tag_name=main" >> $GITHUB_OUTPUT
          echo "tag_provided=false" >> $GITHUB_OUTPUT
        fi

    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        draft: false
        prerelease: false
        files: |
          ./artifacts/**/*