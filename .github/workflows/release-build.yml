name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v1.0.2)'
        required: true
        default: 'v1.0.2'
  push:
    branches: [ main ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish - Windows x64
        run: dotnet publish WorkLedger-Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win-x64

      - name: Publish - Linux x64
        run: dotnet publish WorkLedger-Client.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux-x64

      - name: Publish - macOS x64
        run: dotnet publish WorkLedger-Client.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/osx-x64

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ -d publish/win-x64 ]; then (cd publish/win-x64 && zip -r ../../artifacts/WorkLedger-windows.zip .); fi
          if [ -d publish/linux-x64 ]; then (cd publish/linux-x64 && zip -r ../../artifacts/WorkLedger-linux.zip .); fi
          if [ -d publish/osx-x64 ]; then (cd publish/osx-x64 && zip -r ../../artifacts/WorkLedger-macos.zip .); fi

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'v1.0.2' }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'v1.0.2' }}
          files: artifacts/*.zip
